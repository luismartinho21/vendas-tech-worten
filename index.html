<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Vendas Tech</title>
    <style>
        /* CSS: Adicionei cores diferentes para os botões para não haver confusão */
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 10px; }
        
        /* Estilo comum aos botões */
        button { 
            color: white; border: none; 
            padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer;
            width: 100%; margin-top: 10px;
        }
        
        /* Botão Verde para Registar */
        .btn-venda { background-color: #25D366; }
        
        /* Botão Vermelho para Reset */
        .btn-reset { background-color: #ff4d4d; margin-top: 30px; font-size: 16px; padding: 12px; }
        
        select { padding: 10px; width: 100%; font-size: 16px; margin-bottom: 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 Plano Tech: Registo</h2>
        <p>Seleciona o teu nome e regista a venda:</p>
        
        <select id="membro">
            <option value="João">João</option>
            <option value="Diogo">Diogo</option>
            <option value="Tiago">Tiago</option>
            <option value="Luis">Luis</option>
            <option value="Andre">Andre</option>
            <option value="Martinho">Martinho</option>
        </select>

        <button class="btn-venda" onclick="enviarVenda()">✅ Registar +1 Venda</button>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">
        
        <button class="btn-reset" onclick="resetarVendas()">🗑️ Reiniciar a Zero</button>
    </div>

    <script>
        // Função 1: Registar a venda (igual à que já tínhamos)
        function enviarVenda() {
            const nome = document.getElementById('membro').value;
            const chaveMemoria = 'vendas_' + nome;
            let total = localStorage.getItem(chaveMemoria);

            if (!total) {
                total = 0;
            } else {
                total = parseInt(total); 
            }

            total = total + 1;
            localStorage.setItem(chaveMemoria, total);

            const mensagem = `🚀 *NOVA VENDA TECH!*\n👤 Colaborador: *${nome}*\n📈 Acaba de somar +1 venda!\n🏆 Total: *${total} vendas*`;
            const url = `https://wa.me/?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        // Função 2: NOVA - Limpar a memória
        function resetarVendas() {
            const nome = document.getElementById('membro').value;
            const chaveMemoria = 'vendas_' + nome;
            
            // O comando 'confirm' cria um aviso no ecrã. Se o utilizador clicar em "OK", a variável confirmacao será Verdadeira (true).
            const confirmacao = confirm(`⚠️ Atenção!\nTens a certeza que queres apagar todas as vendas do(a) ${nome}?\n\nO contador vai voltar a zero.`);
            
            if (confirmacao) {
                // O comando 'removeItem' vai à memória do telemóvel e apaga aquele registo específico
                localStorage.removeItem(chaveMemoria);
                
                // Um pequeno aviso a confirmar que correu tudo bem
                alert(`✅ O contador do(a) ${nome} foi reiniciado a zero com sucesso!`);
            }
        }
    </script>

</body>
</html>
